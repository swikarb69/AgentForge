services:
  # Hardened Docker Socket Proxy Sidecar
  # Mediates container execution strictly for the dedicated execution broker.
  # Isolated on broker-internal network; inaccessible to the main application.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.1.3
    container_name: agentforge-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1   # Allow creating, starting, and inspecting containers
      - IMAGES=1       # Allow inspecting sandbox images
      - INFO=1         # Allow docker info ping
      - POST=1         # Allow POST requests for container operations
      - BUILD=0        # Disallow building images
      - COMMIT=0       # Disallow container commits
      - CONFIGS=0      # Disallow configs
      - DISTRIBUTION=0 # Disallow distribution
      - EXEC=0         # Disallow docker exec
      - GRPC=0         # Disallow grpc
      - NETWORKS=0     # Disallow network alterations
      - NODES=0        # Disallow swarm nodes
      - PLUGINS=0      # Disallow plugins
      - SERVICES=0     # Disallow swarm services
      - SESSION=0      # Disallow sessions
      - SWARM=0        # Disallow swarm
      - SYSTEM=0       # Disallow system modification
      - TASKS=0        # Disallow swarm tasks
      - VOLUMES=1      # Allow broker to manage per-execution isolated volumes
      - SECRETS=0      # Disallow secrets access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - broker-internal
    security_opt:
      - no-new-privileges:true

  # Dedicated Sandbox Execution Broker
  # Mediates all container execution requests with zero-trust validation.
  # Owns the Docker connection; creates isolated per-execution workspaces and volumes.
  execution-broker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "backend.app.execution.broker:broker_app", "--host", "0.0.0.0", "--port", "8001"]
    container_name: agentforge-execution-broker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DOCKER_HOST=tcp://docker-proxy:2375
      - DOCKER_CONTAINER_GATEKEEPER_ENFORCED=true
      - DOCKER_PER_EXECUTION_VOLUMES=true
      - DOCKER_NAMED_VOLUME=agentforge-ws
    volumes:
      - agentforge-workspaces:/broker-workspaces
    depends_on:
      - docker-proxy
    networks:
      - broker-internal
      - agentforge-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

  agentforge:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentforge:0.11.0
    container_name: agentforge-app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - APP_NAME=AgentForge
      - APP_VERSION=0.11.0
      - STORAGE_BACKEND=sqlite
      - DATABASE_URL=sqlite:////app/agentforge-storage/agentforge.db
      - API_KEY_AUTH_ENABLED=true
      - API_KEY=${API_KEY:-}
      - CORS_ORIGINS=["http://localhost:3000"]
      - EXECUTION_BROKER_URL=http://execution-broker:8001
      - DOCKER_CONTAINER_GATEKEEPER_ENFORCED=true
      - DOCKER_PER_EXECUTION_VOLUMES=true
      - WORKSPACE_ROOT=/app/agentforge-workspaces
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - agentforge-storage:/app/agentforge-storage
      - agentforge-artifacts:/app/agentforge-artifacts
      - agentforge-workspaces:/app/agentforge-workspaces
    depends_on:
      - execution-broker
    networks:
      - agentforge-internal
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  agentforge-internal:
    name: agentforge-internal
    internal: true
  broker-internal:
    name: broker-internal
    internal: true

volumes:
  agentforge-storage:
    name: agentforge-storage
  agentforge-artifacts:
    name: agentforge-artifacts
  agentforge-workspaces:
    name: agentforge-workspaces
