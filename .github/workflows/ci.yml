name: AgentForge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

  type-check:
    name: Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: MyPy Static Type Check
        run: |
          mypy backend/app

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit Security Scan
        run: |
          bandit -r backend/app

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc

  test-suite:
    name: Pytest Unit, Integration & E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest Unit & Integration Tests with Coverage
        run: |
          set -eo pipefail
          pytest --ignore=tests/integration/test_docker_runtime_isolation.py --cov=backend/app --cov-report=term-missing --cov-fail-under=80 -ra --tb=short 2>&1 | tee pytest_output.txt

      - name: Publish Pytest Failure Summary
        if: always()
        run: |
          if [ -f pytest_output.txt ]; then
            python -c "
import sys
try:
    with open('pytest_output.txt', 'r', errors='replace') as f:
        content = f.read()
    lines = content.splitlines()
    for l in lines:
        if l.startswith('FAILED ') or l.startswith('ERROR '):
            print(f'::error title=Pytest Failure::{l}')
    if '=== FAILURES ===' in content or '=== ERRORS ===' in content:
        for l in lines[-100:]:
            if l.strip():
                print(f'::warning title=Pytest Trace::{l}')
except Exception as e:
    print(f'::warning::Failed to parse pytest output: {e}')
"
          fi

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest_output.txt
          if-no-files-found: ignore

  runtime-isolation:
    name: Live Docker Runtime Isolation Verification
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Sandbox Image
        run: |
          docker build -t agentforge-sandbox:latest -t agentforge-sandbox:0.11.0 -f sandbox/Dockerfile .

      - name: Verify Live Docker Runtime Isolation
        run: |
          set -eo pipefail
          pytest tests/integration/test_docker_runtime_isolation.py -v -s

  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, security-scan, test-suite, runtime-isolation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build -t agentforge:0.11.0 .
