name: AgentForge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality-and-tests:
    name: Code Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

      - name: MyPy Static Type Check
        run: |
          mypy backend/app

      - name: Bandit Security Scan
        run: |
          bandit -r backend/app

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc || echo "pip-audit completed"

      - name: Pytest Unit & Integration Tests with Coverage
        run: |
          pytest --cov=backend/app --cov-report=term-missing --cov-fail-under=80

  docker-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build -t agentforge:0.11.0 .
