name: AgentForge CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff Lint Check
        run: |
          ruff check .

      - name: Ruff Format Check
        run: |
          ruff format --check .

  type-check:
    name: Static Type Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: MyPy Static Type Check
        run: |
          mypy backend/app

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit Security Scan
        run: |
          bandit -r backend/app

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --desc

  test-suite:
    name: Pytest Unit, Integration & E2E Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest Unit & Integration Tests with Coverage
        run: |
          set -eo pipefail
          pytest --ignore=tests/integration/test_docker_runtime_isolation.py --ignore=tests/integration/test_compose_broker_runtime.py --cov=backend/app --cov-report=term-missing --cov-fail-under=80 -ra --tb=short 2>&1 | tee pytest_output.txt

      - name: Publish Pytest Failure Summary
        if: always()
        run: |
          python .github/scripts/publish_test_summary.py

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest_output.txt
          if-no-files-found: ignore

  runtime-isolation:
    name: Live Docker Runtime Isolation Verification
    runs-on: ubuntu-latest
    needs: [test-suite]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Sandbox Image
        run: |
          docker build -t agentforge-sandbox:latest -t agentforge-sandbox:0.11.0 -f sandbox/Dockerfile .

      - name: Verify Live Docker Runtime Isolation
        run: |
          set -eo pipefail
          pytest tests/integration/test_docker_runtime_isolation.py -v -s 2>&1 | tee pytest_output.txt

      - name: Publish Runtime Isolation Failure Summary
        if: always()
        run: |
          python .github/scripts/publish_test_summary.py

  broker-compose-e2e:
    name: Compose Broker Architecture E2E Verification
    runs-on: ubuntu-latest
    needs: [runtime-isolation]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build Sandbox Image
        run: |
          docker build -t agentforge-sandbox:latest -t agentforge-sandbox:0.11.0 -f sandbox/Dockerfile .

      - name: Build Production Application Image
        run: |
          docker build -t agentforge:0.11.0 .

      - name: Start Compose Services (Proxy, Broker, App)
        env:
          API_KEY: test-ci-key
          EXECUTION_BROKER_AUTH_TOKEN: agentforge-broker-internal-secret-token
        run: |
          docker compose up -d docker-proxy execution-broker agentforge || (docker compose logs && exit 1)
          echo "Waiting for services to become healthy..."
          for i in {1..45}; do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' agentforge-execution-broker 2>/dev/null || true)
            if [ "$STATUS" = "healthy" ]; then
              echo "agentforge-execution-broker is healthy."
              break
            fi
            echo "Waiting for agentforge-execution-broker (attempt $i/45, current: ${STATUS:-starting})..."
            sleep 2
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "agentforge-execution-broker failed to become healthy!"
            docker compose ps
            docker compose logs execution-broker
            docker compose logs docker-proxy
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "### Broker Startup Failure Diagnostics" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              docker compose ps >> "$GITHUB_STEP_SUMMARY"
              echo "--- execution-broker logs ---" >> "$GITHUB_STEP_SUMMARY"
              docker compose logs execution-broker >> "$GITHUB_STEP_SUMMARY"
              echo "--- docker-proxy logs ---" >> "$GITHUB_STEP_SUMMARY"
              docker compose logs docker-proxy >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

          for i in {1..45}; do
            APP_STATUS=$(docker inspect --format='{{.State.Health.Status}}' agentforge-app 2>/dev/null || true)
            if [ "$APP_STATUS" = "healthy" ]; then
              echo "agentforge-app is healthy."
              break
            fi
            echo "Waiting for agentforge-app (attempt $i/45, current: ${APP_STATUS:-starting})..."
            sleep 2
          done
          if [ "$APP_STATUS" != "healthy" ]; then
            echo "agentforge-app failed to become healthy!"
            docker compose ps
            docker compose logs agentforge
            if [ -n "$GITHUB_STEP_SUMMARY" ]; then
              echo "### App Startup Failure Diagnostics" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              docker compose ps >> "$GITHUB_STEP_SUMMARY"
              echo "--- agentforge logs ---" >> "$GITHUB_STEP_SUMMARY"
              docker compose logs agentforge >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          docker compose ps

      - name: Prepare Container for Test Execution
        run: |
          docker compose exec -u 0 -T agentforge pip install --no-cache-dir pytest pytest-asyncio
          docker compose cp tests agentforge:/app/tests
          docker compose exec -u 0 -T agentforge chown -R agentforge:agentforge /app/tests

      - name: Verify Live Compose Broker Architecture & Security Boundaries
        run: |
          set -eo pipefail
          docker compose exec -T -e FAIL_IF_SKIPPED=true -e API_KEY=test-ci-key agentforge pytest tests/integration/test_compose_broker_runtime.py -v -s -k "not test_broker_stopped_causes_fail_closed" 2>&1 | tee -a compose_e2e_output.txt

      - name: Verify Fail-Closed Behavior When Broker Is Stopped
        run: |
          set -eo pipefail
          docker compose stop execution-broker
          docker compose exec -T -e FAIL_IF_SKIPPED=true -e API_KEY=test-ci-key agentforge pytest tests/integration/test_compose_broker_runtime.py -v -s -k "test_broker_stopped_causes_fail_closed" 2>&1 | tee -a compose_e2e_output.txt

      - name: Publish E2E Test Summary
        if: always()
        run: |
          python .github/scripts/publish_test_summary.py

      - name: Teardown Compose Services
        if: always()
        run: |
          docker compose down -v

  container-build:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check, security-scan, test-suite, runtime-isolation, broker-compose-e2e]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        run: |
          docker build -t agentforge:0.11.0 .
